services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ticketing-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      MSSQL_PID: "Developer"
    volumes:
      - sql-data:/var/opt/mssql
    networks:
      - ticketing-net
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -C -b || exit 1
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: TicketingSystem.API/Dockerfile
    container_name: ticketing-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=TicketingDB;User Id=sa;Password=${DB_PASSWORD:?Set DB_PASSWORD in .env};TrustServerCertificate=True;MultipleActiveResultSets=True;"
      FileStorage__Path: "/app/uploads"
      FileStorage__BaseUrl: "http://localhost:8080/files"
      JwtSettings__SecretKey: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      JwtSettings__ExpiryMinutes: "60"
    volumes:
      - uploads:/app/uploads
    networks:
      - ticketing-net

  web:
    build:
      context: .
      dockerfile: TicketingSystem.Web/Dockerfile
    container_name: ticketing-web
    restart: unless-stopped
    ports:
      - "5000:8080"
    depends_on:
      - api
    environment:
      ApiBaseUrl: "http://api:8080"
    networks:
      - ticketing-net

volumes:
  sql-data:
    driver: local
  uploads:
    driver: local

networks:
  ticketing-net:
    driver: bridge
